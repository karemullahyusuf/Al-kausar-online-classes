<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Class Launcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrNrQj8RzKy7UHNifSY7jpeSw1qtSeDOI",
            authDomain: "jki-zoom-links.firebaseapp.com",
            databaseURL: "https://jki-zoom-links-default-rtdb.firebaseio.com",
            projectId: "jki-zoom-links",
            storageBucket: "jki-zoom-links.firebasestorage.app",
            messagingSenderId: "890464047034",
            appId: "1:890464047034:web:4448d2d73ee4a6f4a85783",
            measurementId: "G-S3JLLDYRWY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const meetingsRef = ref(db, 'meetings');

        let meetingsData = {};

        onValue(meetingsRef, (snapshot) => {
            meetingsData = snapshot.val() || {};
            renderMeetings();
        });

        // Render Function with Search Filter
        window.renderMeetings = function() {
            const container = document.getElementById('meetingContainer');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();
            container.innerHTML = '';

            const keys = Object.keys(meetingsData);

            if (keys.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-400 text-xs"><i class="fa-solid fa-inbox text-2xl mb-2 block"></i>ဒေတာ မရှိသေးပါ။ "အသစ်ထည့်ရန်" ကို နှိပ်၍ ထည့်သွင်းပါ။</div>';
                return;
            }

            let matchCount = 0;

            keys.forEach(key => {
                const item = meetingsData[key];
                
                // Search matching logic
                const nameMatch = (item.name || '').toLowerCase().includes(searchKeyword);
                const idMatch = (item.idNum || '').toLowerCase().includes(searchKeyword);
                const phoneMatch = (item.phone || '').toLowerCase().includes(searchKeyword);
                const dayMatch = (item.scheduleDays || '').toLowerCase().includes(searchKeyword);
                
                // Search inside periods
                let periodMatch = false;
                if (item.periods) {
                    Object.values(item.periods).forEach(val => {
                        if (val.toLowerCase().includes(searchKeyword)) periodMatch = true;
                    });
                }

                if (searchKeyword && !nameMatch && !idMatch && !phoneMatch && !dayMatch && !periodMatch) {
                    return; // Skip if no search match
                }

                matchCount++;

                // Build Periods HTML
                let periodsHTML = '';
                if (item.periods) {
                    const activePeriods = [];
                    for (let i = 1; i <= 8; i++) {
                        if (item.periods[`p${i}`]) {
                            activePeriods.push(`<span class="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded text-[10px] border border-indigo-100 font-medium">ချိန်${i}: ${item.periods[`p${i}`]}</span>`);
                        }
                    }
                    if (activePeriods.length > 0) {
                        periodsHTML = `<div class="flex flex-wrap gap-1 mt-1.5">${activePeriods.join('')}</div>`;
                    }
                }

                const callBtn = item.phone 
                    ? `<a href="tel:${item.phone}" title="ဖုန်းခေါ်ရန်" class="px-2.5 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-lg text-xs font-medium flex items-center gap-1 transition-colors">
                        <i class="fa-solid fa-phone"></i> <span class="hidden sm:inline">Call</span>
                       </a>`
                    : '';

                const dayBadge = item.scheduleDays 
                    ? `<span class="inline-flex items-center gap-1 text-[11px] text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md font-medium">
                        <i class="fa-regular fa-calendar-days text-[10px]"></i> ${item.scheduleDays}
                       </span>`
                    : '';

                const card = document.createElement('div');
                card.className = "flex flex-col p-3 md:p-4 bg-white border border-gray-200 rounded-xl gap-2 shadow-sm hover:shadow-md transition-all";
                
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div class="text-left flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap mb-0.5">
                                <h3 class="font-bold text-gray-800 text-sm md:text-base truncate">${item.name}</h3>
                                ${dayBadge}
                            </div>
                            <p class="text-[11px] text-gray-400">ID: ${item.idNum || 'N/A'} ${item.phone ? ' • ' + item.phone : ''}</p>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            ${callBtn}
                            <a href="${item.link}" target="_blank" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-xs md:text-sm flex items-center gap-1.5 transition-colors">
                                <i class="fa-solid fa-video"></i> Join
                            </a>
                            <button onclick="openEditModal('${key}')" title="ပြင်ရန်" class="p-2 bg-amber-50 hover:bg-amber-100 text-amber-600 rounded-lg transition-colors">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button onclick="deleteMeeting('${key}')" title="ဖျက်ရန်" class="p-2 bg-red-50 hover:bg-red-100 text-red-500 rounded-lg transition-colors">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                    ${periodsHTML}
                `;
                container.appendChild(card);
            });

            if (searchKeyword && matchCount === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs">"${searchKeyword}" နှင့် ပတ်သက်သော စာရင်း ရှာမတွေ့ပါ။</div>`;
            }
        };

        // Save / Update Meeting
        window.saveMeeting = function() {
            const editId = document.getElementById('editKey').value;
            const name = document.getElementById('teacherName').value.trim();
            const link = document.getElementById('zoomLink').value.trim();
            const idNum = document.getElementById('meetingId').value.trim();
            const phone = document.getElementById('teacherPhone').value.trim();
            const scheduleDays = document.getElementById('scheduleDays').value.trim();

            const periods = {};
            for (let i = 1; i <= 8; i++) {
                const val = document.getElementById(`p${i}`).value.trim();
                if (val) periods[`p${i}`] = val;
            }

            if (!name || !link) {
                alert("ကျေးဇူးပြု၍ ဆရာအမည်နှင့် Zoom Link ကို ထည့်သွင်းပါ။");
                return;
            }

            const payload = { name, link, idNum, phone, scheduleDays, periods };

            if (editId) {
                update(ref(db, `meetings/${editId}`), payload)
                    .then(() => toggleModal(false))
                    .catch(err => alert("Error: " + err.message));
            } else {
                push(meetingsRef, payload)
                    .then(() => toggleModal(false))
                    .catch(err => alert("Error: " + err.message));
            }
        };

        window.openEditModal = function(key) {
            const item = meetingsData[key];
            if (!item) return;

            document.getElementById('modalTitle').innerText = "Class အချက်အလက် ပြင်ရန်";
            document.getElementById('editKey').value = key;
            document.getElementById('teacherName').value = item.name || '';
            document.getElementById('zoomLink').value = item.link || '';
            document.getElementById('meetingId').value = item.idNum || '';
            document.getElementById('teacherPhone').value = item.phone || '';
            document.getElementById('scheduleDays').value = item.scheduleDays || 'စနေ - ကြာသပတေး';

            const periods = item.periods || {};
            for (let i = 1; i <= 8; i++) {
                document.getElementById(`p${i}`).value = periods[`p${i}`] || '';
            }

            toggleModal(true);
        };

        window.openAddModal = function() {
            document.getElementById('modalTitle').innerText = "Class အသစ်ထည့်ရန်";
            document.getElementById('editKey').value = '';
            document.getElementById('teacherName').value = '';
            document.getElementById('zoomLink').value = '';
            document.getElementById('meetingId').value = '';
            document.getElementById('teacherPhone').value = '';
            document.getElementById('scheduleDays').value = 'စနေ - ကြာသပတေး';

            for (let i = 1; i <= 8; i++) {
                document.getElementById(`p${i}`).value = '';
            }

            toggleModal(true);
        };

        window.deleteMeeting = function(key) {
            if (confirm("ဒီ Class ကို ဖျက်ရန် သေချာပါသလား။")) {
                remove(ref(db, `meetings/${key}`));
            }
        };
    </script>
</head>
<body class="bg-gray-50 min-h-screen p-2 md:p-4">

    <div class="w-full max-w-2xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between gap-2 mb-3 pb-3 border-b border-gray-200">
            <div>
                <h1 class="text-lg md:text-xl font-bold text-blue-600 flex items-center gap-1.5">
                    <i class="fa-solid fa-graduation-cap"></i> Al-Kausar Classes
                </h1>
                <p class="text-[11px] text-gray-400">Zoom Quick Launcher</p>
            </div>
            <button onclick="openAddModal()" class="px-3 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-xs font-medium flex items-center gap-1.5 shadow-sm transition-colors">
                <i class="fa-solid fa-plus"></i> အသစ်ထည့်ရန်
            </button>
        </div>

        <!-- Search Bar -->
        <div class="relative mb-3">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
            <input type="text" id="searchInput" oninput="renderMeetings()" placeholder="ဆရာအမည်၊ အတန်း သို့မဟုတ် ID ဖြင့် ရှာရန်..." class="w-full pl-9 pr-4 py-2 bg-white border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
        </div>

        <!-- Meeting List -->
        <div id="meetingContainer" class="space-y-2">
            <div class="text-center py-6 text-gray-400 text-xs">
                <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Data များ ရယူနေပါသည်...
            </div>
        </div>
    </div>

    <!-- Modal Form (Add & Edit) -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-3 z-50 overflow-y-auto">
        <div class="bg-white rounded-2xl p-4 md:p-5 w-full max-w-md shadow-xl my-8 max-h-[90vh] overflow-y-auto">
            <h2 id="modalTitle" class="text-base font-bold mb-3 text-gray-800">Class အသစ်ထည့်ရန်</h2>
            <input type="hidden" id="editKey">
            
            <div class="space-y-2.5">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 mb-1">ဆရာအမည် *</label>
                    <input type="text" id="teacherName" placeholder="ဥပမာ - ဆရာဘေလားလ်" class="w-full p-2 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 mb-1">Zoom Link *</label>
                    <input type="text" id="zoomLink" placeholder="https://us05web.zoom.us/j/..." class="w-full p-2 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Meeting ID</label>
                        <input type="text" id="meetingId" placeholder="123 456 7890" class="w-full p-2 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">ဖုန်းနံပါတ်</label>
                        <input type="text" id="teacherPhone" placeholder="09xxxxxxxxx" class="w-full p-2 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 mb-1">သင်ကြားမည့်ရက်များ</label>
                    <input type="text" id="scheduleDays" placeholder="ဥပမာ - စနေ - ကြာသပတေး" class="w-full p-2 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Periods 1 to 8 Grid -->
                <div class="border-t border-gray-100 pt-2.5 mt-2">
                    <label class="block text-[11px] font-bold text-indigo-600 mb-1.5">တစ်နေ့တာ အချိန်ဇယား (၁ချိန် မှ ၈ချိန်)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <span class="text-[10px] text-gray-500">၁ ချိန်မြောက်</span>
                            <input type="text" id="p1" placeholder="ဥပမာ - Grade-1" class="w-full p-1.5 border border-gray-200 rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <span class="text-[10px] text-gray-500">၂ ချိန်မြောက်</span>
                            <input type="text" id="p2" placeholder="ဥပမာ - Grade-2" class="w-full p-1.5 border border-gray-200 rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <span class="text-[10px] text-gray-500">၃ ချိန်မြောက်</span>
                            <input type="text" id="p3" placeholder="ဥပမာ - Grade-3" class="w-full p-1.5 border border-gray-200 rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <span class="text-[10px] text-gray-500">၄ ချိန်မြောက်</span>
                            <input type="text" id="p4" placeholder="ဥပမာ - Grade-4" class="w-full p-1.5 border border-gray-200 rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <span class="text-[10px] text-gray-500">၅ ချိန်မြောက်</span>
                            <input type="text" id="p5" placeholder="ဥပမာ - Grade-5" class="w-full p-1.5 border border-gray-200 rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <span class="text-[10px] text-gray-500">၆ ချိန်မြောက်</span>
                            <input type="text" id="p6" placeholder="ဥပမာ - Grade-6" class="w-full p-1.5 border border-gray-200 rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <span class="text-[10px] text-gray-500">၇ ချိန်မြောက်</span>
                            <input type="text" id="p7" placeholder="ဥပမာ - Grade-7" class="w-full p-1.5 border border-gray-200 rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <span class="text-[10px] text-gray-500">၈ ချိန်မြောက်</span>
                            <input type="text" id="p8" placeholder="ဥပမာ - Grade-8" class="w-full p-1.5 border border-gray-200 rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-end gap-2 mt-4 pt-2 border-t border-gray-100">
                <button onclick="toggleModal(false)" class="px-3.5 py-1.5 text-gray-500 hover:bg-gray-100 rounded-lg text-xs">မလုပ်တော့ပါ</button>
                <button onclick="saveMeeting()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition-colors">သိမ်းဆည်းမည်</button>
            </div>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('addModal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }
    </script>
</body>
</html>
