<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Class Launcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrNrQj8RzKy7UHNifSY7jpeSw1qtSeDOI",
            authDomain: "jki-zoom-links.firebaseapp.com",
            databaseURL: "https://jki-zoom-links-default-rtdb.firebaseio.com",
            projectId: "jki-zoom-links",
            storageBucket: "jki-zoom-links.firebasestorage.app",
            messagingSenderId: "890464047034",
            appId: "1:890464047034:web:4448d2d73ee4a6f4a85783",
            measurementId: "G-S3JLLDYRWY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const meetingsRef = ref(db, 'meetings');

        let meetingsData = {};

        const initialMeetings = [
            { name: "ဆရာဘေလားလ်", link: "https://us04web.zoom.us/j/9795210258?pwd=2aV7Pi7Xcf2MlD6vBMCJkCqjblLClc.1", idNum: "979 521 0258", phone: "" },
            { name: "ဆရာကရီမွလ္လာဟ် (မြစ်ငယ်)", link: "https://us05web.zoom.us/j/4355547172?pwd=h2hFdUKAKPWI3mExGMmc55ixaXBb2B.1", idNum: "435 554 7172", phone: "" },
            { name: "ဆရာအလီ (ကန့်ဘလူ)", link: "https://us05web.zoom.us/j/6630245838?pwd=UW42Vwp4KVma8v8uSyLMAgLrji1RGC.1", idNum: "663 024 5838", phone: "" },
            { name: "ဆရာအစ်မသွလ္လာဟ်", link: "https://us05web.zoom.us/j/3164364823?pwd=F7ukUm2Dvpu3lzfantBRrZ3KaUGMDe.1", idNum: "316 436 4823", phone: "" },
            { name: "ဆရာနအီမွဒ္ဒီးန်", link: "https://us05web.zoom.us/j/7785528717?pwd=z4886ErarfOfsF9tSbdKvYHZ41HnVv.1", idNum: "778 552 8717", phone: "" },
            { name: "ဆရာနူရွလ်ဟစံ", link: "https://us05web.zoom.us/j/5735477979?pwd=z38taFrgNX01cOZpe4SlIP6iObPPC7.1", idNum: "573 547 7979", phone: "" }
        ];

        onValue(meetingsRef, (snapshot) => {
            const data = snapshot.val();
            meetingsData = data || {};
            const container = document.getElementById('meetingContainer');
            container.innerHTML = '';

            if (!data) {
                initialMeetings.forEach(m => push(meetingsRef, m));
                return;
            }

            Object.keys(data).forEach(key => {
                const item = data[key];
                const card = document.createElement('div');
                card.className = "flex items-center justify-between p-3 md:p-4 bg-white border border-gray-200 rounded-xl gap-2 shadow-sm hover:shadow-md transition-all";
                
                // Call Button HTML
                const callBtn = item.phone 
                    ? `<a href="tel:${item.phone}" title="ဖုန်းခေါ်ရန်" class="px-2.5 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-lg text-xs font-medium flex items-center gap-1 transition-colors">
                        <i class="fa-solid fa-phone"></i> <span class="hidden sm:inline">Call</span>
                       </a>`
                    : '';

                card.innerHTML = `
                    <div class="text-left flex-1 min-w-0 pr-2">
                        <h3 class="font-bold text-gray-800 text-sm md:text-base truncate">${item.name}</h3>
                        <p class="text-[11px] text-gray-400">ID: ${item.idNum || 'N/A'} ${item.phone ? ' • ' + item.phone : ''}</p>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        ${callBtn}
                        <a href="${item.link}" target="_blank" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-xs md:text-sm flex items-center gap-1.5 transition-colors">
                            <i class="fa-solid fa-video"></i> Join
                        </a>
                        <button onclick="openEditModal('${key}')" title="ပြင်ရန်" class="p-2 bg-amber-50 hover:bg-amber-100 text-amber-600 rounded-lg transition-colors">
                            <i class="fa-solid fa-pen-to-square text-xs"></i>
                        </button>
                        <button onclick="deleteMeeting('${key}')" title="ဖျက်ရန်" class="p-2 bg-red-50 hover:bg-red-100 text-red-500 rounded-lg transition-colors">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        });

        // Save / Update Meeting Function
        window.saveMeeting = function() {
            const editId = document.getElementById('editKey').value;
            const name = document.getElementById('teacherName').value.trim();
            const link = document.getElementById('zoomLink').value.trim();
            const idNum = document.getElementById('meetingId').value.trim();
            const phone = document.getElementById('teacherPhone').value.trim();

            if (!name || !link) {
                alert("ကျေးဇူးပြု၍ ဆရာအမည်နှင့် Zoom Link ကို ထည့်သွင်းပါ။");
                return;
            }

            if (editId) {
                // Update Existing Data
                update(ref(db, `meetings/${editId}`), { name, link, idNum, phone })
                    .then(() => toggleModal(false))
                    .catch(err => alert("Error: " + err.message));
            } else {
                // Add New Data
                push(meetingsRef, { name, link, idNum, phone })
                    .then(() => toggleModal(false))
                    .catch(err => alert("Error: " + err.message));
            }
        };

        // Open Modal for Editing
        window.openEditModal = function(key) {
            const item = meetingsData[key];
            if (!item) return;

            document.getElementById('modalTitle').innerText = "Class အချက်အလက် ပြင်ရန်";
            document.getElementById('editKey').value = key;
            document.getElementById('teacherName').value = item.name || '';
            document.getElementById('zoomLink').value = item.link || '';
            document.getElementById('meetingId').value = item.idNum || '';
            document.getElementById('teacherPhone').value = item.phone || '';
            toggleModal(true);
        };

        // Open Modal for Adding New
        window.openAddModal = function() {
            document.getElementById('modalTitle').innerText = "Class အသစ်ထည့်ရန်";
            document.getElementById('editKey').value = '';
            document.getElementById('teacherName').value = '';
            document.getElementById('zoomLink').value = '';
            document.getElementById('meetingId').value = '';
            document.getElementById('teacherPhone').value = '';
            toggleModal(true);
        };

        // Delete Meeting
        window.deleteMeeting = function(key) {
            if (confirm("ဒီ Class ကို ဖျက်ရန် သေချာပါသလား။")) {
                remove(ref(db, `meetings/${key}`));
            }
        };
    </script>
</head>
<body class="bg-white min-h-screen p-2 md:p-4">

    <div class="w-full max-w-2xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between gap-2 mb-4 pb-3 border-b border-gray-100">
            <div>
                <h1 class="text-lg md:text-xl font-bold text-blue-600 flex items-center gap-1.5">
                    <i class="fa-solid fa-graduation-cap"></i> Al-Kausar Classes
                </h1>
                <p class="text-[11px] text-gray-400">Zoom Quick Launcher</p>
            </div>
            <button onclick="openAddModal()" class="px-3 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-xs font-medium flex items-center gap-1.5 shadow-sm transition-colors">
                <i class="fa-solid fa-plus"></i> အသစ်ထည့်ရန်
            </button>
        </div>

        <!-- Meeting List -->
        <div id="meetingContainer" class="space-y-2">
            <div class="text-center py-6 text-gray-400 text-xs">
                <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Data များ ရယူနေပါသည်...
            </div>
        </div>
    </div>

    <!-- Modal Form (Add & Edit Box) -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-5 w-full max-w-md shadow-xl">
            <h2 id="modalTitle" class="text-lg font-bold mb-3 text-gray-800">Class အသစ်ထည့်ရန်</h2>
            <input type="hidden" id="editKey">
            
            <div class="space-y-2.5">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ဆရာအမည်</label>
                    <input type="text" id="teacherName" placeholder="ဥပမာ - ဆရာဘေလားလ်" class="w-full p-2.5 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Zoom Link</label>
                    <input type="text" id="zoomLink" placeholder="https://us05web.zoom.us/j/..." class="w-full p-2.5 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Meeting ID (Optional)</label>
                    <input type="text" id="meetingId" placeholder="123 456 7890" class="w-full p-2.5 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ဖုန်းနံပါတ် (Optional)</label>
                    <input type="text" id="teacherPhone" placeholder="09xxxxxxxxx" class="w-full p-2.5 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div class="flex justify-end gap-2 mt-5">
                <button onclick="toggleModal(false)" class="px-3.5 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-xs">မလုပ်တော့ပါ</button>
                <button onclick="saveMeeting()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition-colors">သိမ်းဆည်းမည်</button>
            </div>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('addModal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }
    </script>
</body>
</html>
