<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zoom Class Launcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrNrQj8RzKy7UHNifSY7jpeSw1qtSeDOI",
            authDomain: "jki-zoom-links.firebaseapp.com",
            databaseURL: "https://jki-zoom-links-default-rtdb.firebaseio.com",
            projectId: "jki-zoom-links",
            storageBucket: "jki-zoom-links.firebasestorage.app",
            messagingSenderId: "890464047034",
            appId: "1:890464047034:web:4448d2d73ee4a6f4a85783",
            measurementId: "G-S3JLLDYRWY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const meetingsRef = ref(db, 'meetings');

        let meetingsData = {};
        window.activeViewDays = {}; // Track selected tab for each teacher card
        window.activeModalDay = 'sat';

        const daysList = [
            { id: 'sat', label: 'စနေ' },
            { id: 'sun', label: 'တနင်္ဂနွေ' },
            { id: 'mon', label: 'တနင်္လာ' },
            { id: 'tue', label: 'အင်္ဂါ' },
            { id: 'wed', label: 'ဗုဒ္ဓဟူး' },
            { id: 'thu', label: 'ကြာသပတေး' }
        ];

        onValue(meetingsRef, (snapshot) => {
            meetingsData = snapshot.val() || {};
            renderMeetings();
        });

        window.renderMeetings = function() {
            const container = document.getElementById('meetingContainer');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();
            container.innerHTML = '';

            const keys = Object.keys(meetingsData);

            if (keys.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-400 text-xs"><i class="fa-solid fa-inbox text-3xl mb-2 block text-gray-300"></i>ဒေတာ မရှိသေးပါ။ "အသစ်ထည့်ရန်" ကို နှိပ်၍ ထည့်သွင်းပါ။</div>';
                return;
            }

            let matchCount = 0;

            keys.forEach(key => {
                const item = meetingsData[key];
                
                const nameMatch = (item.name || '').toLowerCase().includes(searchKeyword);
                const idMatch = (item.idNum || '').toLowerCase().includes(searchKeyword);
                const phoneMatch = (item.phone || '').toLowerCase().includes(searchKeyword);
                
                let scheduleMatch = false;
                if (item.weeklySchedule) {
                    scheduleMatch = JSON.stringify(item.weeklySchedule).toLowerCase().includes(searchKeyword);
                }

                if (searchKeyword && !nameMatch && !idMatch && !phoneMatch && !scheduleMatch) {
                    return;
                }

                matchCount++;

                // Default active day for card
                if (!window.activeViewDays[key]) {
                    window.activeViewDays[key] = 'sat';
                }
                const currentDay = window.activeViewDays[key];

                // Build Day Filter Tabs HTML for Card
                let dayTabsHTML = '';
                daysList.forEach(d => {
                    const hasData = item.weeklySchedule && item.weeklySchedule[d.id] && Object.keys(item.weeklySchedule[d.id]).length > 0;
                    const isActive = currentDay === d.id;

                    let btnStyle = "px-2.5 py-1 text-[11px] rounded-lg transition-all shrink-0 font-medium ";
                    if (isActive) {
                        btnStyle += "bg-indigo-600 text-white shadow-sm";
                    } else if (hasData) {
                        btnStyle += "bg-indigo-50 text-indigo-600 hover:bg-indigo-100";
                    } else {
                        btnStyle += "bg-gray-100 text-gray-400 hover:bg-gray-200";
                    }

                    dayTabsHTML += `<button onclick="changeCardDay('${key}', '${d.id}')" class="${btnStyle}">${d.label}</button>`;
                });

                // Build Active Day's Periods UI
                let periodsHTML = '';
                const daySchedule = item.weeklySchedule ? item.weeklySchedule[currentDay] : null;

                if (daySchedule && Object.keys(daySchedule).length > 0) {
                    let periodCards = [];
                    for (let i = 1; i <= 8; i++) {
                        if (daySchedule[`p${i}`]) {
                            periodCards.push(`
                                <div class="bg-indigo-50/60 border border-indigo-100 rounded-lg p-1.5 flex flex-col justify-center text-center">
                                    <span class="text-[9px] font-bold text-indigo-400 uppercase tracking-wider">ချိန် ${i}</span>
                                    <span class="text-xs font-semibold text-indigo-950 truncate mt-0.5">${daySchedule[`p${i}`]}</span>
                                </div>
                            `);
                        }
                    }
                    if (periodCards.length > 0) {
                        periodsHTML = `<div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 mt-2">${periodCards.join('')}</div>`;
                    } else {
                        periodsHTML = `<div class="text-[11px] text-gray-400 italic py-2 text-center bg-gray-50/50 rounded-lg border border-dashed border-gray-200 mt-2">ဤနေ့အတွက် သင်ကြားမည့် အတန်း မရှိပါ။</div>`;
                    }
                } else {
                    periodsHTML = `<div class="text-[11px] text-gray-400 italic py-2 text-center bg-gray-50/50 rounded-lg border border-dashed border-gray-200 mt-2">ဤနေ့အတွက် သင်ကြားမည့် အတန်း မရှိပါ။</div>`;
                }

                const callBtn = item.phone 
                    ? `<a href="tel:${item.phone}" title="ဖုန်းခေါ်ရန်" class="px-3 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all shadow-sm">
                        <i class="fa-solid fa-phone"></i> <span class="hidden sm:inline">Call</span>
                       </a>`
                    : '';

                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200/80 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all space-y-3";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <div class="text-left flex-1 min-w-0">
                            <h3 class="font-bold text-gray-800 text-base truncate">${item.name}</h3>
                            <p class="text-xs text-gray-400 mt-0.5"><i class="fa-regular fa-id-badge text-gray-400 mr-1"></i>${item.idNum || 'N/A'} ${item.phone ? ' • ' + item.phone : ''}</p>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            ${callBtn}
                            <a href="${item.link}" target="_blank" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl text-xs sm:text-sm flex items-center gap-1.5 transition-all shadow-sm">
                                <i class="fa-solid fa-video"></i> Join
                            </a>
                            <button onclick="openEditModal('${key}')" title="ပြင်ရန်" class="p-2 bg-amber-50 hover:bg-amber-100 text-amber-600 rounded-xl transition-all">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                            <button onclick="deleteMeeting('${key}')" title="ဖျက်ရန်" class="p-2 bg-red-50 hover:bg-red-100 text-red-500 rounded-xl transition-all">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Day Tabs for Schedule -->
                    <div class="pt-2 border-t border-gray-100">
                        <div class="flex items-center gap-1 overflow-x-auto pb-1 scrollbar-none">
                            ${dayTabsHTML}
                        </div>
                        ${periodsHTML}
                    </div>
                `;
                container.appendChild(card);
            });

            if (searchKeyword && matchCount === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">"${searchKeyword}" နှင့် ပတ်သက်သော စာရင်း ရှာမတွေ့ပါ။</div>`;
            }
        };

        window.changeCardDay = function(key, dayId) {
            window.activeViewDays[key] = dayId;
            renderMeetings();
        };

        window.tempSchedule = {};

        window.switchModalDay = function(dayId) {
            saveCurrentDayToTemp();
            window.activeModalDay = dayId;
            
            daysList.forEach(d => {
                const btn = document.getElementById(`tab-${d.id}`);
                if (d.id === dayId) {
                    btn.className = "px-3 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-medium shrink-0 transition-all shadow-sm";
                } else {
                    btn.className = "px-3 py-1.5 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-xl text-xs font-medium shrink-0 transition-all";
                }
            });

            const dayData = window.tempSchedule[dayId] || {};
            for (let i = 1; i <= 8; i++) {
                document.getElementById(`p${i}`).value = dayData[`p${i}`] || '';
            }
        };

        function saveCurrentDayToTemp() {
            const dayId = window.activeModalDay;
            if (!window.tempSchedule[dayId]) window.tempSchedule[dayId] = {};
            
            for (let i = 1; i <= 8; i++) {
                const val = document.getElementById(`p${i}`).value.trim();
                if (val) {
                    window.tempSchedule[dayId][`p${i}`] = val;
                } else {
                    delete window.tempSchedule[dayId][`p${i}`];
                }
            }
        }

        window.saveMeeting = function() {
            saveCurrentDayToTemp();

            const editId = document.getElementById('editKey').value;
            const name = document.getElementById('teacherName').value.trim();
            const link = document.getElementById('zoomLink').value.trim();
            const idNum = document.getElementById('meetingId').value.trim();
            const phone = document.getElementById('teacherPhone').value.trim();

            if (!name || !link) {
                alert("ကျေးဇူးပြု၍ ဆရာအမည်နှင့် Zoom Link ကို ထည့်သွင်းပါ။");
                return;
            }

            const payload = { name, link, idNum, phone, weeklySchedule: window.tempSchedule };

            if (editId) {
                update(ref(db, `meetings/${editId}`), payload)
                    .then(() => toggleModal(false))
                    .catch(err => alert("Error: " + err.message));
            } else {
                push(meetingsRef, payload)
                    .then(() => toggleModal(false))
                    .catch(err => alert("Error: " + err.message));
            }
        };

        window.openEditModal = function(key) {
            const item = meetingsData[key];
            if (!item) return;

            document.getElementById('modalTitle').innerText = "Class အချက်အလက် ပြင်ရန်";
            document.getElementById('editKey').value = key;
            document.getElementById('teacherName').value = item.name || '';
            document.getElementById('zoomLink').value = item.link || '';
            document.getElementById('meetingId').value = item.idNum || '';
            document.getElementById('teacherPhone').value = item.phone || '';

            window.tempSchedule = JSON.parse(JSON.stringify(item.weeklySchedule || {}));
            switchModalDay('sat');
            toggleModal(true);
        };

        window.openAddModal = function() {
            document.getElementById('modalTitle').innerText = "Class အသစ်ထည့်ရန်";
            document.getElementById('editKey').value = '';
            document.getElementById('teacherName').value = '';
            document.getElementById('zoomLink').value = '';
            document.getElementById('meetingId').value = '';
            document.getElementById('teacherPhone').value = '';

            window.tempSchedule = {};
            switchModalDay('sat');
            toggleModal(true);
        };

        window.deleteMeeting = function(key) {
            if (confirm("ဒီ Class ကို ဖျက်ရန် သေချာပါသလား။")) {
                remove(ref(db, `meetings/${key}`));
            }
        };
    </script>
</head>
<body class="bg-gray-50/50 min-h-screen p-3 md:p-6">

    <div class="w-full max-w-2xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between gap-2 mb-4 pb-3 border-b border-gray-200/60">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-blue-600 flex items-center gap-2 tracking-tight">
                    <i class="fa-solid fa-graduation-cap text-blue-600"></i> Al-Kausar Classes
                </h1>
                <p class="text-xs text-gray-400 font-medium mt-0.5">Zoom Quick Launcher & Schedule</p>
            </div>
            <button onclick="openAddModal()" class="px-3.5 py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-sm transition-all">
                <i class="fa-solid fa-plus text-xs"></i> အသစ်ထည့်ရန်
            </button>
        </div>

        <!-- Search Bar -->
        <div class="relative mb-4">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
            <input type="text" id="searchInput" oninput="renderMeetings()" placeholder="ဆရာအမည်၊ အတန်း သို့မဟုတ် ID ဖြင့် ရှာရန်..." class="w-full pl-9 pr-4 py-2.5 bg-white border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/50 shadow-sm transition-all">
        </div>

        <!-- Meeting List -->
        <div id="meetingContainer" class="space-y-3">
            <div class="text-center py-10 text-gray-400 text-xs">
                <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Data များ ရယူနေပါသည်...
            </div>
        </div>
    </div>

    <!-- Modal Form (Add & Edit) -->
    <div id="addModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-3 z-50 overflow-y-auto">
        <div class="bg-white rounded-3xl p-5 w-full max-w-md shadow-2xl my-8 max-h-[90vh] overflow-y-auto border border-gray-100">
            <h2 id="modalTitle" class="text-base font-bold mb-3 text-gray-800">Class အသစ်ထည့်ရန်</h2>
            <input type="hidden" id="editKey">
            
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">ဆရာအမည် *</label>
                    <input type="text" id="teacherName" placeholder="ဥပမာ - ဆရာဘေလားလ်" class="w-full p-2.5 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">Zoom Link *</label>
                    <input type="text" id="zoomLink" placeholder="https://us05web.zoom.us/j/..." class="w-full p-2.5 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">Meeting ID</label>
                        <input type="text" id="meetingId" placeholder="123 456 7890" class="w-full p-2.5 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">ဖုန်းနံပါတ်</label>
                        <input type="text" id="teacherPhone" placeholder="09xxxxxxxxx" class="w-full p-2.5 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- Day Tabs and Periods 1 to 8 -->
                <div class="border-t border-gray-100 pt-3 mt-2">
                    <label class="block text-[11px] font-bold text-indigo-600 mb-2">ချိန်ဇယား ပြင်ဆင်ရန် (၁ချိန် မှ ၈ချိန်)</label>

                    <div class="flex gap-1 overflow-x-auto pb-2 scrollbar-none mb-2">
                        <button id="tab-sat" onclick="switchModalDay('sat')" class="px-3 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-medium shrink-0">စနေ</button>
                        <button id="tab-sun" onclick="switchModalDay('sun')" class="px-3 py-1.5 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-xl text-xs font-medium shrink-0">တနင်္ဂနွေ</button>
                        <button id="tab-mon" onclick="switchModalDay('mon')" class="px-3 py-1.5 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-xl text-xs font-medium shrink-0">တနင်္လာ</button>
                        <button id="tab-tue" onclick="switchModalDay('tue')" class="px-3 py-1.5 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-xl text-xs font-medium shrink-0">အင်္ဂါ</button>
                        <button id="tab-wed" onclick="switchModalDay('wed')" class="px-3 py-1.5 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-xl text-xs font-medium shrink-0">ဗုဒ္ဓဟူး</button>
                        <button id="tab-thu" onclick="switchModalDay('thu')" class="px-3 py-1.5 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-xl text-xs font-medium shrink-0">ကြာသပတေး</button>
                    </div>

                    <div class="grid grid-cols-2 gap-2 bg-gray-50/80 p-3 rounded-2xl border border-gray-100">
                        <div>
                            <span class="text-[10px] font-medium text-gray-400">၁ ချိန်မြောက်</span>
                            <input type="text" id="p1" placeholder="Grade-1" class="w-full p-1.5 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                        </div>
                        <div>
                            <span class="text-[10px] font-medium text-gray-400">၂ ချိန်မြောက်</span>
                            <input type="text" id="p2" placeholder="Grade-2" class="w-full p-1.5 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                        </div>
                        <div>
                            <span class="text-[10px] font-medium text-gray-400">၃ ချိန်မြောက်</span>
                            <input type="text" id="p3" placeholder="Grade-3" class="w-full p-1.5 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                        </div>
                        <div>
                            <span class="text-[10px] font-medium text-gray-400">၄ ချိန်မြောက်</span>
                            <input type="text" id="p4" placeholder="Grade-4" class="w-full p-1.5 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                        </div>
                        <div>
                            <span class="text-[10px] font-medium text-gray-400">၅ ချိန်မြောက်</span>
                            <input type="text" id="p5" placeholder="Grade-5" class="w-full p-1.5 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                        </div>
                        <div>
                            <span class="text-[10px] font-medium text-gray-400">၆ ချိန်မြောက်</span>
                            <input type="text" id="p6" placeholder="Grade-6" class="w-full p-1.5 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                        </div>
                        <div>
                            <span class="text-[10px] font-medium text-gray-400">၇ ချိန်မြောက်</span>
                            <input type="text" id="p7" placeholder="Grade-7" class="w-full p-1.5 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                        </div>
                        <div>
                            <span class="text-[10px] font-medium text-gray-400">၈ ချိန်မြောက်</span>
                            <input type="text" id="p8" placeholder="Grade-8" class="w-full p-1.5 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-end gap-2 mt-5 pt-3 border-t border-gray-100">
                <button onclick="toggleModal(false)" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-xl text-xs font-medium">မလုပ်တော့ပါ</button>
                <button onclick="saveMeeting()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-sm transition-all">သိမ်းဆည်းမည်</button>
            </div>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('addModal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }
    </script>
</body>
</html>
