<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Al-Kausar Classes | Zoom Launcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'mm': ['"Noto Sans Myanmar"', '"Padauk"', 'sans-serif'],
                    },
                    colors: {
                        'islamic': {
                            50: '#f0f9f4',
                            100: '#dcf0e4',
                            200: '#bce0cb',
                            300: '#8ec9a8',
                            400: '#5aab80',
                            500: '#368d5f',
                            600: '#25714b',
                            700: '#1e5a3e',
                            800: '#1a4833',
                            900: '#163b2b',
                            950: '#0b2017',
                        },
                        'gold': {
                            50: '#fdf9ed',
                            100: '#f9efc9',
                            200: '#f3dd8f',
                            300: '#ecc555',
                            400: '#e6b02e',
                            500: '#d4941a',
                            600: '#b87214',
                            700: '#935214',
                            800: '#7a4218',
                            900: '#683818',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Sans Myanmar', 'Padauk', sans-serif;
            background-color: #f0f9f4;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(54, 141, 95, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(212, 148, 26, 0.05) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23368d5f' stroke-opacity='0.06' stroke-width='1'%3E%3Cpath d='M30 0 L60 30 L30 60 L0 30 Z'/%3E%3Cpath d='M30 15 L45 30 L30 45 L15 30 Z'/%3E%3C/g%3E%3C/svg%3E");
            background-attachment: fixed;
        }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        
        .ornament-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4941a 50%, transparent);
            position: relative;
        }
        .ornament-divider::before {
            content: '◆';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #d4941a;
            background: #f0f9f4;
            padding: 0 8px;
            font-size: 10px;
        }

        .btn-glow {
            box-shadow: 0 4px 14px rgba(54, 141, 95, 0.25);
        }
        .btn-glow:hover {
            box-shadow: 0 6px 20px rgba(54, 141, 95, 0.35);
        }
    </style>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrNrQj8RzKy7UHNifSY7jpeSw1qtSeDOI",
            authDomain: "jki-zoom-links.firebaseapp.com",
            databaseURL: "https://jki-zoom-links-default-rtdb.firebaseio.com",
            projectId: "jki-zoom-links",
            storageBucket: "jki-zoom-links.firebasestorage.app",
            messagingSenderId: "890464047034",
            appId: "1:890464047034:web:4448d2d73ee4a6f4a85783",
            measurementId: "G-S3JLLDYRWY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const meetingsRef = ref(db, 'meetings');
        const announcementRef = ref(db, 'announcement');

        let meetingsData = {};
        window.activeViewDays = {};
        window.expandedCards = {};
        window.activeModalDay = 'sat';

        const daysList = [
            { id: 'sat', label: 'စနေ' },
            { id: 'sun', label: 'တနင်္ဂနွေ' },
            { id: 'mon', label: 'တနင်္လာ' },
            { id: 'tue', label: 'အင်္ဂါ' },
            { id: 'wed', label: 'ဗုဒ္ဓဟူး' },
            { id: 'thu', label: 'ကြာသပတေး' },
            { id: 'fri', label: 'သောကြာ' }
        ];

        // Format helper
        function formatPeriodText(pData) {
            if (!pData) return '';
            if (typeof pData === 'string') return pData;
            if (typeof pData === 'object') {
                if (!pData.grade) return '';
                if (pData.section && pData.section !== '-') {
                    return `${pData.grade} (${pData.section})`;
                }
                return pData.grade;
            }
            return '';
        }

        // Fetch Announcement Data
        onValue(announcementRef, (snapshot) => {
            const data = snapshot.val();
            const textEl = document.getElementById('announcementText');
            if (data && data.text) {
                textEl.innerText = data.text;
            } else {
                textEl.innerText = "ကျောင်းနှင့် ပတ်သက်သော သတင်းအချက်အလက်များနှင့် ကြေညာချက်များကို ဤနေရာတွင် ဖော်ပြပေးသွားမည် ဖြစ်ပါသည်။";
            }
        });

        // Fetch Meetings Data
        onValue(meetingsRef, (snapshot) => {
            const data = snapshot.val();
            meetingsData = data || {};
            renderMeetings();
        });

        // Navigation Control
        window.navigateTo = function(page) {
            const homePage = document.getElementById('homePage');
            const teachersPage = document.getElementById('teachersPage');
            
            if (page === 'teachers') {
                homePage.classList.add('hidden');
                teachersPage.classList.remove('hidden');
                window.scrollTo(0, 0);
            } else {
                teachersPage.classList.add('hidden');
                homePage.classList.remove('hidden');
                window.scrollTo(0, 0);
            }
        };

        window.handleSearch = function() {
            const homeSearch = document.getElementById('homeSearchInput').value;
            document.getElementById('teacherSearchInput').value = homeSearch;
            window.navigateTo('teachers');
            renderMeetings();
        };

        window.toggleAccordion = function(key) {
            window.expandedCards[key] = !window.expandedCards[key];
            renderMeetings();
        };

        window.renderMeetings = function() {
            const container = document.getElementById('meetingContainer');
            const searchKeyword = document.getElementById('teacherSearchInput').value.toLowerCase().trim();
            container.innerHTML = '';

            const keys = Object.keys(meetingsData);

            if (keys.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-islamic-600/60 text-xs">
                    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-islamic-50 mb-3 border border-islamic-100">
                        <i class="fa-solid fa-mosque text-3xl text-islamic-400"></i>
                    </div>
                    <p class="font-medium">ဒေတာ မရှိသေးပါ</p>
                </div>`;
                return;
            }

            let matchCount = 0;

            keys.forEach(key => {
                const item = meetingsData[key];
                
                const nameMatch = (item.name || '').toLowerCase().includes(searchKeyword);
                const idMatch = (item.idNum || '').toLowerCase().includes(searchKeyword);
                const phoneMatch = (item.phone || '').toLowerCase().includes(searchKeyword);
                
                let scheduleMatch = false;
                if (item.weeklySchedule) {
                    const schedStr = JSON.stringify(item.weeklySchedule).toLowerCase();
                    scheduleMatch = schedStr.includes(searchKeyword);
                }

                if (searchKeyword && !nameMatch && !idMatch && !phoneMatch && !scheduleMatch) {
                    return;
                }

                matchCount++;

                if (!window.activeViewDays[key]) {
                    window.activeViewDays[key] = 'sat';
                }
                const currentDay = window.activeViewDays[key];
                const isExpanded = searchKeyword ? true : !!window.expandedCards[key];

                let dayTabsHTML = '';
                daysList.forEach(d => {
                    const hasData = item.weeklySchedule && item.weeklySchedule[d.id] && Object.keys(item.weeklySchedule[d.id]).length > 0;
                    const isActive = currentDay === d.id;

                    let btnStyle = "px-2.5 py-1 text-[11px] rounded-lg transition-all shrink-0 font-semibold border ";
                    if (isActive) {
                        btnStyle += "bg-islamic-600 text-white border-islamic-600 shadow-sm";
                    } else if (hasData) {
                        btnStyle += "bg-gold-50 text-gold-700 border-gold-200 hover:bg-gold-100";
                    } else {
                        btnStyle += "bg-white text-gray-400 border-gray-200 hover:bg-gray-50";
                    }

                    dayTabsHTML += `<button onclick="event.stopPropagation(); changeCardDay('${key}', '${d.id}')" class="${btnStyle}">${d.label}</button>`;
                });

                let periodsHTML = '';
                const daySchedule = item.weeklySchedule ? item.weeklySchedule[currentDay] : null;

                if (daySchedule && Object.keys(daySchedule).length > 0) {
                    let hasPeriods = false;
                    let tableHeaders = '';
                    let tableCells = '';

                    for (let i = 1; i <= 8; i++) {
                        const formattedText = formatPeriodText(daySchedule[`p${i}`]);
                        if (formattedText) {
                            hasPeriods = true;
                            tableHeaders += `<th class="px-3 py-1.5 text-center text-[10px] font-bold text-gold-700 bg-gold-50 border-r border-gold-200/60 last:border-r-0 uppercase tracking-wider whitespace-nowrap">ချိန် ${i}</th>`;
                            tableCells += `<td class="px-3 py-2 text-center text-xs font-semibold text-islamic-900 border-r border-islamic-100 last:border-r-0 whitespace-nowrap bg-white/80">${formattedText}</td>`;
                        }
                    }

                    if (hasPeriods) {
                        periodsHTML = `
                            <div class="mt-2.5 overflow-x-auto scrollbar-none rounded-xl border border-islamic-200/80 shadow-sm">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="border-b border-gold-200/80">
                                            ${tableHeaders}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            ${tableCells}
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        `;
                    } else {
                        periodsHTML = `<div class="text-[11px] text-islamic-500/70 italic py-2 text-center bg-islamic-50/50 rounded-lg border border-dashed border-islamic-200 mt-2">ဤနေ့အတွက် သင်ကြားမည့် အတန်း မရှိပါ</div>`;
                    }
                } else {
                    periodsHTML = `<div class="text-[11px] text-islamic-500/70 italic py-2 text-center bg-islamic-50/50 rounded-lg border border-dashed border-islamic-200 mt-2">ဤနေ့အတွက် သင်ကြားမည့် အတန်း မရှိပါ</div>`;
                }

                const callBtn = item.phone 
                    ? `<a href="tel:${item.phone}" onclick="event.stopPropagation();" title="ဖုန်းခေါ်ရန်" class="p-2 bg-gold-50 hover:bg-gold-100 text-gold-700 rounded-xl text-xs font-semibold transition-all border border-gold-200">
                        <i class="fa-solid fa-phone"></i>
                       </a>`
                    : '';

                const card = document.createElement('div');
                card.className = "bg-white/95 backdrop-blur-sm border border-islamic-100 rounded-2xl shadow-sm hover:border-gold-300 transition-all duration-200 overflow-hidden";
                
                card.innerHTML = `
                    <div onclick="toggleAccordion('${key}')" class="p-3.5 flex items-center justify-between cursor-pointer hover:bg-islamic-50/50 transition-colors">
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            <div class="w-10 h-10 rounded-xl bg-islamic-100 text-islamic-700 flex items-center justify-center font-bold text-sm shrink-0 border border-islamic-200">
                                <i class="fa-solid fa-user-tie"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                                <h3 class="font-bold text-islamic-900 text-sm sm:text-base truncate">${item.name}</h3>
                                <p class="text-[11px] text-islamic-500 truncate">
                                    <i class="fa-regular fa-id-badge text-gold-500 mr-1"></i>${item.idNum || 'N/A'} ${item.phone ? ' • ' + item.phone : ''}
                                </p>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 shrink-0 ml-2">
                            ${callBtn}
                            <a href="${item.link}" target="_blank" onclick="event.stopPropagation();" class="px-3 py-1.5 bg-gradient-to-br from-islamic-500 to-islamic-700 hover:from-islamic-600 hover:to-islamic-800 text-white font-semibold rounded-xl text-xs flex items-center gap-1 transition-all shadow-md btn-glow">
                                <i class="fa-solid fa-video"></i> Join
                            </a>
                            <div class="w-7 h-7 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400 text-xs transition-transform ${isExpanded ? 'rotate-180 text-islamic-600 bg-islamic-100' : ''}">
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                        </div>
                    </div>

                    <div class="${isExpanded ? 'block' : 'hidden'} px-3.5 pb-3.5 pt-1 border-t border-islamic-100/70 bg-islamic-50/30">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[10px] font-bold text-islamic-600 uppercase tracking-wider">အချိန်ဇယား ကြည့်ရန်</span>
                            <div class="flex gap-1">
                                <button onclick="event.stopPropagation(); openEditModal('${key}')" title="ပြင်ရန်" class="px-2 py-1 bg-gold-50 hover:bg-gold-100 text-gold-700 rounded-lg text-[11px] transition-all border border-gold-200 flex items-center gap-1">
                                    <i class="fa-solid fa-pen-to-square"></i> ပြင်ရန်
                                </button>
                                <button onclick="event.stopPropagation(); deleteMeeting('${key}')" title="ဖျက်ရန်" class="px-2 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-[11px] transition-all border border-red-100 flex items-center gap-1">
                                    <i class="fa-solid fa-trash-can"></i> ဖျက်ရန်
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 overflow-x-auto pb-1 scrollbar-none">
                            ${dayTabsHTML}
                        </div>
                        ${periodsHTML}
                    </div>
                `;
                container.appendChild(card);
            });

            if (searchKeyword && matchCount === 0) {
                container.innerHTML = `<div class="text-center py-10 text-islamic-500 text-xs">
                    <i class="fa-solid fa-magnifying-glass text-2xl mb-2 block text-islamic-300"></i>
                    "${searchKeyword}" နှင့် ပတ်သက်သော စာရင်း ရှာမတွေ့ပါ
                </div>`;
            }
        };

        window.changeCardDay = function(key, dayId) {
            window.activeViewDays[key] = dayId;
            renderMeetings();
        };

        // Announcement Edit Logic
        window.openAnnouncementModal = function() {
            const currentText = document.getElementById('announcementText').innerText;
            document.getElementById('announcementInput').value = currentText;
            document.getElementById('announcementModal').classList.remove('hidden');
        };

        window.saveAnnouncement = function() {
            const text = document.getElementById('announcementInput').value.trim();
            if (!text) {
                alert("ကြေညာချက် စာသား ထည့်ပါ။");
                return;
            }

            const pwd = prompt("ပြင်ဆင်ရန် Admin Password ရိုက်ထည့်ပါ:");
            if (pwd === "55155") {
                set(announcementRef, { text })
                    .then(() => document.getElementById('announcementModal').classList.add('hidden'))
                    .catch(err => alert("Error: " + err.message));
            } else if (pwd !== null) {
                alert("Password မမှန်ကန်ပါ။");
            }
        };

        window.tempSchedule = {};

        window.handleGradeChange = function(index) {
            const gradeSelect = document.getElementById(`p${index}_grade`);
            const customInput = document.getElementById(`p${index}_custom`);
            if (gradeSelect.value === 'Other') {
                customInput.classList.remove('hidden');
            } else {
                customInput.classList.add('hidden');
                customInput.value = '';
            }
        };

        window.loadDayToInputs = function(dayId) {
            window.activeModalDay = dayId;
            
            daysList.forEach(d => {
                const btn = document.getElementById(`tab-${d.id}`);
                if (btn) {
                    btn.className = (d.id === dayId)
                        ? "px-3 py-1.5 bg-islamic-600 text-white rounded-xl text-xs font-semibold shrink-0 transition-all shadow-sm border border-islamic-600"
                        : "px-3 py-1.5 bg-white text-islamic-700 hover:bg-islamic-50 rounded-xl text-xs font-semibold shrink-0 transition-all border border-islamic-200";
                }
            });

            const dayData = window.tempSchedule[dayId] || {};
            for (let i = 1; i <= 8; i++) {
                const pVal = dayData[`p${i}`];
                const gradeSelect = document.getElementById(`p${i}_grade`);
                const secSelect = document.getElementById(`p${i}_sec`);
                const customInput = document.getElementById(`p${i}_custom`);

                if (!pVal) {
                    gradeSelect.value = '';
                    secSelect.value = '-';
                    customInput.value = '';
                    customInput.classList.add('hidden');
                } else if (typeof pVal === 'string') {
                    gradeSelect.value = 'Other';
                    secSelect.value = '-';
                    customInput.value = pVal;
                    customInput.classList.remove('hidden');
                } else {
                    if (pVal.isOther) {
                        gradeSelect.value = 'Other';
                        customInput.value = pVal.grade || '';
                        customInput.classList.remove('hidden');
                    } else {
                        gradeSelect.value = pVal.grade || '';
                        customInput.value = '';
                        customInput.classList.add('hidden');
                    }
                    secSelect.value = pVal.section || '-';
                }
            }
        };

        window.switchModalDay = function(dayId) {
            saveCurrentDayToTemp();
            window.loadDayToInputs(dayId);
        };

        function saveCurrentDayToTemp() {
            const dayId = window.activeModalDay;
            if (!window.tempSchedule[dayId]) window.tempSchedule[dayId] = {};
            
            for (let i = 1; i <= 8; i++) {
                const gradeVal = document.getElementById(`p${i}_grade`).value;
                const secVal = document.getElementById(`p${i}_sec`).value;
                const customVal = document.getElementById(`p${i}_custom`).value.trim();

                if (gradeVal === 'Other') {
                    if (customVal) {
                        window.tempSchedule[dayId][`p${i}`] = { grade: customVal, section: secVal, isOther: true };
                    } else {
                        delete window.tempSchedule[dayId][`p${i}`];
                    }
                } else if (gradeVal) {
                    window.tempSchedule[dayId][`p${i}`] = { grade: gradeVal, section: secVal };
                } else {
                    delete window.tempSchedule[dayId][`p${i}`];
                }
            }
        }

        window.saveMeeting = function() {
            saveCurrentDayToTemp();

            const editId = document.getElementById('editKey').value;
            const name = document.getElementById('teacherName').value.trim();
            const link = document.getElementById('zoomLink').value.trim();
            const idNum = document.getElementById('meetingId').value.trim();
            const phone = document.getElementById('teacherPhone').value.trim();

            if (!name || !link) {
                alert("ကျေးဇူးပြု၍ ဆရာအမည်နှင့် Zoom Link ကို ထည့်သွင်းပါ။");
                return;
            }

            const pwd = prompt("သိမ်းဆည်းရန် Admin Password ရိုက်ထည့်ပါ:");
            if (pwd !== "55155") {
                if (pwd !== null) alert("Password မမှန်ကန်ပါ။");
                return;
            }

            const payload = { name, link, idNum, phone, weeklySchedule: window.tempSchedule };

            if (editId) {
                update(ref(db, `meetings/${editId}`), payload)
                    .then(() => toggleModal(false))
                    .catch(err => alert("Error: " + err.message));
            } else {
                push(meetingsRef, payload)
                    .then(() => toggleModal(false))
                    .catch(err => alert("Error: " + err.message));
            }
        };

        window.openEditModal = function(key) {
            const item = meetingsData[key];
            if (!item) return;

            document.getElementById('modalTitle').innerText = "အတန်း အချက်အလက် ပြင်ရန်";
            document.getElementById('editKey').value = key;
            document.getElementById('teacherName').value = item.name || '';
            document.getElementById('zoomLink').value = item.link || '';
            document.getElementById('meetingId').value = item.idNum || '';
            document.getElementById('teacherPhone').value = item.phone || '';

            window.tempSchedule = JSON.parse(JSON.stringify(item.weeklySchedule || {}));
            window.loadDayToInputs('sat');
            toggleModal(true);
        };

        window.openAddModal = function() {
            document.getElementById('modalTitle').innerText = "အတန်းအသစ် ထည့်ရန်";
            document.getElementById('editKey').value = '';
            document.getElementById('teacherName').value = '';
            document.getElementById('zoomLink').value = '';
            document.getElementById('meetingId').value = '';
            document.getElementById('teacherPhone').value = '';

            window.tempSchedule = {};
            window.loadDayToInputs('sat');
            toggleModal(true);
        };

        window.deleteMeeting = function(key) {
            const pwd = prompt("ဖျက်ရန် Admin Password ရိုက်ထည့်ပါ:");
            if (pwd === "55155") {
                if (confirm("ဒီအတန်းကို ဖျက်ရန် သေချာပါသလား။")) {
                    remove(ref(db, `meetings/${key}`));
                }
            } else if (pwd !== null) {
                alert("Password မမှန်ကန်ပါ။");
            }
        };
    </script>
</head>
<body class="min-h-screen p-3 md:p-6 font-mm">

    <div class="w-full max-w-2xl mx-auto">
        
        <!-- PAGE 1: HOME DASHBOARD -->
        <div id="homePage" class="space-y-4">
            <!-- Header Card -->
            <div class="bg-white/95 backdrop-blur-sm rounded-2xl p-4 shadow-sm border border-islamic-100 relative overflow-hidden">
                <div class="flex items-center justify-between gap-2">
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold text-islamic-800 flex items-center gap-2 tracking-tight">
                            <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-br from-islamic-500 to-islamic-700 text-white shadow-md">
                                <i class="fa-solid fa-graduation-cap text-sm"></i>
                            </span>
                            Al-Kausar Classes
                        </h1>
                        <p class="text-xs text-islamic-500 font-medium mt-1 flex items-center gap-1.5">
                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-gold-400"></span>
                            Zoom Quick Launcher & Schedule
                        </p>
                    </div>
                    <button onclick="openAddModal()" class="px-3.5 py-2.5 bg-gradient-to-br from-gold-400 to-gold-600 hover:from-gold-500 hover:to-gold-700 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-md transition-all">
                        <i class="fa-solid fa-plus text-xs"></i> အသစ်ထည့်ရန်
                    </button>
                </div>
            </div>

            <!-- Dynamic Announcement Card -->
            <div class="bg-gradient-to-br from-white to-gold-50/50 rounded-2xl p-4 shadow-sm border border-gold-200/80 relative">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-gold-700 flex items-center gap-1.5">
                        <i class="fa-solid fa-bullhorn text-gold-500"></i>
                        ကျောင်းကြေညာချက်
                    </span>
                    <button onclick="openAnnouncementModal()" title="ကြေညာချက် ပြင်ရန်" class="text-[11px] text-gold-600 hover:text-gold-800 font-medium px-2 py-0.5 rounded-lg bg-gold-100/50 hover:bg-gold-100 border border-gold-200 transition-all">
                        <i class="fa-solid fa-pen-to-square mr-0.5"></i> ပြင်ရန်
                    </button>
                </div>
                <p id="announcementText" class="text-xs text-islamic-900 leading-relaxed font-normal bg-white/60 p-3 rounded-xl border border-gold-100/80">
                    <i class="fa-solid fa-circle-notch fa-spin text-gold-400 mr-1"></i> ကြေညာချက် ရယူနေပါသည်...
                </p>
            </div>

            <!-- Search Card -->
            <div class="bg-white/95 backdrop-blur-sm p-4 rounded-2xl border border-islamic-100 shadow-sm">
                <label class="block text-xs font-bold text-islamic-700 mb-2">
                    <i class="fa-solid fa-magnifying-glass text-gold-500 mr-1"></i> အတန်း/ဆရာ ရှာဖွေရန်
                </label>
                <div class="flex gap-2">
                    <input type="text" id="homeSearchInput" onkeypress="if(event.key==='Enter') handleSearch()" placeholder="ဆရာအမည် သို့မဟုတ် အတန်း ရိုက်ပါ..." class="flex-1 px-3.5 py-2.5 bg-islamic-50/40 border border-islamic-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-islamic-500/40 focus:border-islamic-400">
                    <button onclick="handleSearch()" class="px-4 py-2.5 bg-islamic-600 hover:bg-islamic-700 text-white rounded-xl text-xs font-semibold shadow-sm transition-all">
                        ရှာမည်
                    </button>
                </div>
            </div>

            <div class="ornament-divider my-6"></div>

            <!-- Main Navigation Button to Page 2 -->
            <button onclick="navigateTo('teachers')" class="w-full p-4 bg-gradient-to-r from-islamic-600 via-islamic-700 to-islamic-800 hover:from-islamic-700 hover:to-islamic-900 text-white rounded-2xl font-bold text-sm sm:text-base flex items-center justify-between shadow-lg btn-glow transition-all group">
                <span class="flex items-center gap-3">
                    <span class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-gold-300">
                        <i class="fa-solid fa-chalkboard-user text-lg"></i>
                    </span>
                    <span>ဆရာများစာရင်း ကြည့်ရန်</span>
                </span>
                <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform text-gold-300"></i>
            </button>
        </div>

        <!-- PAGE 2: TEACHERS & SCHEDULE LIST -->
        <div id="teachersPage" class="space-y-3 hidden">
            <!-- Back Navigation Header -->
            <div class="bg-white/95 backdrop-blur-sm rounded-2xl p-3 shadow-sm border border-islamic-100 flex items-center justify-between">
                <button onclick="navigateTo('home')" class="px-3 py-1.5 bg-islamic-50 hover:bg-islamic-100 text-islamic-700 rounded-xl text-xs font-bold border border-islamic-200 flex items-center gap-1.5 transition-all">
                    <i class="fa-solid fa-arrow-left"></i> မူလစာမျက်နှာ
                </button>
                <h2 class="text-xs sm:text-sm font-bold text-islamic-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-users-rectangle text-gold-500"></i>
                    ဆရာများ စာရင်းနှင့် အချိန်ဇယား
                </h2>
                <button onclick="openAddModal()" class="px-2.5 py-1.5 bg-gold-500 hover:bg-gold-600 text-white rounded-xl text-xs font-bold transition-all shadow-sm">
                    + အသစ်
                </button>
            </div>

            <!-- Search Bar in Teachers Page -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-islamic-400 text-xs"></i>
                <input type="text" id="teacherSearchInput" oninput="renderMeetings()" placeholder="ဆရာအမည်၊ အတန်း သို့မဟုတ် ID ဖြင့် ရှာရန်..." class="w-full pl-9 pr-4 py-2.5 bg-white/95 backdrop-blur-sm border border-islamic-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-islamic-500/40 focus:border-islamic-400 shadow-sm transition-all">
            </div>

            <!-- Meeting List Container -->
            <div id="meetingContainer" class="space-y-2.5 pt-1">
                <div class="text-center py-10 text-islamic-500 text-xs">
                    <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Data များ ရယူနေပါသည်...
                </div>
            </div>
        </div>

        <div class="ornament-divider mt-8 mb-3"></div>
        <p class="text-center text-[10px] text-islamic-400 font-medium tracking-widest">﷽</p>
    </div>

    <!-- Announcement Edit Modal -->
    <div id="announcementModal" class="fixed inset-0 bg-islamic-950/50 backdrop-blur-sm hidden flex items-center justify-center p-3 z-50">
        <div class="bg-white rounded-3xl p-5 w-full max-w-md shadow-2xl border border-islamic-100">
            <h3 class="text-sm font-bold text-islamic-800 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-bullhorn text-gold-500"></i>
                ကျောင်းကြေညာချက် ပြင်ဆင်ရန်
            </h3>
            <textarea id="announcementInput" rows="4" class="w-full p-3 border border-islamic-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-islamic-500/40 focus:border-islamic-400 bg-islamic-50/20 mb-3" placeholder="ကြေညာချက် စာသား ရိုက်ထည့်ပါ..."></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="document.getElementById('announcementModal').classList.add('hidden')" class="px-3.5 py-2 text-islamic-600 hover:bg-islamic-50 rounded-xl text-xs font-medium">မလုပ်တော့ပါ</button>
                <button onclick="saveAnnouncement()" class="px-4 py-2 bg-islamic-600 hover:bg-islamic-700 text-white rounded-xl text-xs font-semibold shadow-md btn-glow">သိမ်းဆည်းမည်</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Teacher Modal Form -->
    <div id="addModal" onclick="if(event.target.id==='addModal') toggleModal(false)" class="fixed inset-0 bg-islamic-950/50 backdrop-blur-sm hidden flex items-center justify-center p-3 z-50 overflow-y-auto">
        <div class="bg-white rounded-3xl p-5 w-full max-w-md shadow-2xl my-8 max-h-[90vh] overflow-y-auto border border-islamic-100 relative">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-islamic-500 via-gold-400 to-islamic-500 rounded-t-3xl"></div>
            
            <div class="flex items-center gap-2 mb-4 mt-1">
                <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-islamic-50 text-islamic-600 border border-islamic-100">
                    <i class="fa-solid fa-book-open text-xs"></i>
                </span>
                <h2 id="modalTitle" class="text-base font-bold text-islamic-800">အတန်းအသစ် ထည့်ရန်</h2>
            </div>
            
            <input type="hidden" id="editKey">
            
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-islamic-700 mb-1">ဆရာအမည် *</label>
                    <input type="text" id="teacherName" placeholder="ဥပမာ - ဆရာဘေလားလ်" class="w-full p-2.5 border border-islamic-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-islamic-500/40 focus:border-islamic-400 bg-islamic-50/30">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-islamic-700 mb-1">Zoom Link *</label>
                    <input type="text" id="zoomLink" placeholder="https://us05web.zoom.us/j/..." class="w-full p-2.5 border border-islamic-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-islamic-500/40 focus:border-islamic-400 bg-islamic-50/30">
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-islamic-700 mb-1">Meeting ID</label>
                        <input type="text" id="meetingId" placeholder="123 456 7890" class="w-full p-2.5 border border-islamic-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-islamic-500/40 focus:border-islamic-400 bg-islamic-50/30">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-islamic-700 mb-1">ဖုန်းနံပါတ်</label>
                        <input type="text" id="teacherPhone" placeholder="09xxxxxxxxx" class="w-full p-2.5 border border-islamic-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-islamic-500/40 focus:border-islamic-400 bg-islamic-50/30">
                    </div>
                </div>

                <div class="border-t border-islamic-100 pt-3 mt-2">
                    <label class="block text-[11px] font-bold text-gold-700 mb-2 flex items-center gap-1.5">
                        <i class="fa-solid fa-calendar-days text-gold-500"></i>
                        ချိန်ဇယား ပြင်ဆင်ရန် (၁ ချိန် မှ ၈ ချိန်)
                    </label>

                    <div class="flex gap-1 overflow-x-auto pb-2 scrollbar-none mb-2">
                        <button id="tab-sat" onclick="switchModalDay('sat')" class="px-3 py-1.5 bg-islamic-600 text-white rounded-xl text-xs font-semibold shrink-0 border border-islamic-600">စနေ</button>
                        <button id="tab-sun" onclick="switchModalDay('sun')" class="px-3 py-1.5 bg-white text-islamic-700 hover:bg-islamic-50 rounded-xl text-xs font-semibold shrink-0 border border-islamic-200">တနင်္ဂနွေ</button>
                        <button id="tab-mon" onclick="switchModalDay('mon')" class="px-3 py-1.5 bg-white text-islamic-700 hover:bg-islamic-50 rounded-xl text-xs font-semibold shrink-0 border border-islamic-200">တနင်္လာ</button>
                        <button id="tab-tue" onclick="switchModalDay('tue')" class="px-3 py-1.5 bg-white text-islamic-700 hover:bg-islamic-50 rounded-xl text-xs font-semibold shrink-0 border border-islamic-200">အင်္ဂါ</button>
                        <button id="tab-wed" onclick="switchModalDay('wed')" class="px-3 py-1.5 bg-white text-islamic-700 hover:bg-islamic-50 rounded-xl text-xs font-semibold shrink-0 border border-islamic-200">ဗုဒ္ဓဟူး</button>
                        <button id="tab-thu" onclick="switchModalDay('thu')" class="px-3 py-1.5 bg-white text-islamic-700 hover:bg-islamic-50 rounded-xl text-xs font-semibold shrink-0 border border-islamic-200">ကြာသပတေး</button>
                        <button id="tab-fri" onclick="switchModalDay('fri')" class="px-3 py-1.5 bg-white text-islamic-700 hover:bg-islamic-50 rounded-xl text-xs font-semibold shrink-0 border border-islamic-200">သောကြာ</button>
                    </div>

                    <div class="space-y-2 bg-gradient-to-br from-islamic-50/80 to-gold-50/40 p-3 rounded-2xl border border-islamic-100 max-h-[260px] overflow-y-auto">
                        <script>
                            for (let i = 1; i <= 8; i++) {
                                document.write(`
                                    <div class="bg-white p-2 rounded-xl border border-islamic-100 shadow-2xs">
                                        <div class="flex items-center justify-between mb-1">
                                            <span class="text-[10px] font-bold text-islamic-700">${i} ချိန်မြောက်</span>
                                        </div>
                                        <div class="grid grid-cols-5 gap-1.5">
                                            <select id="p${i}_grade" onchange="handleGradeChange(${i})" class="col-span-3 p-1.5 border border-islamic-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-islamic-500 bg-white">
                                                <option value="">- အတန်းမရှိ -</option>
                                                <option value="Grade-1">Grade-1</option>
                                                <option value="Grade-2">Grade-2</option>
                                                <option value="Grade-3">Grade-3</option>
                                                <option value="Grade-4">Grade-4</option>
                                                <option value="Grade-5">Grade-5</option>
                                                <option value="Grade-6">Grade-6</option>
                                                <option value="Grade-7">Grade-7</option>
                                                <option value="Grade-8">Grade-8</option>
                                                <option value="Grade-9">Grade-9</option>
                                                <option value="Other">Other (အခြား)</option>
                                            </select>
                                            <select id="p${i}_sec" class="col-span-2 p-1.5 border border-islamic-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-islamic-500 bg-white font-semibold text-center">
                                                <option value="-">- (None)</option>
                                                <option value="A">A</option>
                                                <option value="B">B</option>
                                                <option value="C">C</option>
                                                <option value="D">D</option>
                                            </select>
                                        </div>
                                        <input type="text" id="p${i}_custom" placeholder="အတန်း/ဘာသာရပ် အမည်ရိုက်ပါ..." class="hidden w-full mt-1.5 p-1.5 border border-gold-300 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-gold-500 bg-gold-50/30">
                                    </div>
                                `);
                            }
                        </script>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-end gap-2 mt-5 pt-3 border-t border-islamic-100">
                <button onclick="toggleModal(false)" class="px-4 py-2 text-islamic-600 hover:bg-islamic-50 rounded-xl text-xs font-medium transition-all">မလုပ်တော့ပါ</button>
                <button onclick="saveMeeting()" class="px-5 py-2 bg-gradient-to-br from-islamic-500 to-islamic-700 hover:from-islamic-600 hover:to-islamic-800 text-white rounded-xl text-xs font-semibold shadow-md btn-glow transition-all">သိမ်းဆည်းမည်</button>
            </div>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('addModal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }
    </script>
</body>
</html>
